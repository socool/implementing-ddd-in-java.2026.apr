info:
  name: second visit - Beaver Bruce 1803kg
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/calculatePrice"
  body:
    type: json
    data: |-
      {
        "date": "2023-07-23",
        "dropped_fractions": [
          {
            "amount_dropped": 1803,
            "fraction_type": "Construction waste"
          }
        ],
        "person_id": "Beaver Bruce",
        "visit_id": "2"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.getBody();

        test("Response should have the correct price amount calculated for dropped fractions", function() {
          expect(data.price_amount).to.equal(490.63);
        });

        test("Response should have the correct person ID", function() {
          expect(data.person_id).to.equal("Beaver Bruce");
        });

        test("Response should have the correct visit ID", function() {
          expect(data.visit_id).to.equal("2");
        });

        test("Response should have the correct currency", function() {
          expect(data.price_currency).to.equal("USD");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
