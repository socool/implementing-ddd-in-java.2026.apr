info:
  name: third visit
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/calculatePrice"
  body:
    type: json
    data: |-
      {
        "date": "2023-07-25",
        "dropped_fractions": [
          {
            "amount_dropped": 103,
            "fraction_type": "Green waste"
          }
        ],
        "person_id": "Squirrel Gus",
        "visit_id": "4"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.getBody();

        test("Response should have the correct price amount calculated for dropped fractions", function() {
          expect(data.price_amount).to.equal(8.65);
        });

        test("Response should have the correct person ID", function() {
          expect(data.person_id).to.equal("Squirrel Gus");
        });

        test("Response should have the correct visit ID", function() {
          expect(data.visit_id).to.equal("4");
        });

        test("Response should have the correct currency", function() {
          expect(data.price_currency).to.equal("USD");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
